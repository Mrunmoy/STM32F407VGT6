CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# osal_zephyr.c dynamically allocates per-task stacks (k_thread_stack_alloc)
# and per-queue k_msgq control blocks/buffers (k_malloc/k_msgq_alloc_init) -
# mirrors osal_threadx.c's own use of ThreadX's byte pool for the same
# purpose. Raw stack requests alone total ~36.9KB (USB Host process task
# 4096B + storage service task 8192B + 4 client tasks x 6144B each), plus a
# k_msgq buffer (StorageRequest is ~530B x queue depth 8) and per-allocation
# heap/MPU-guard overhead on top. 40960 was NOT enough - confirmed on real
# hardware: the 6th task (AbaIso/scenario4) failed to allocate its stack and
# logged "storageDemo: task creation failed", silently leaving that one
# scenario never running while the other three passed - same "measure on
# real hardware, don't trust a guess" lesson the FreeRTOS/ThreadX ports
# already learned the hard way for their own stack/heap sizing. Sized with
# real headroom now, not just past the observed failure point.
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_HEAP_MEM_POOL_SIZE=65536

# cfuture_osal_zephyr.c's event/wait synchronization.
CONFIG_EVENTS=y

# main's own stack (Logger + LED loop) plus the app's other static/system
# threads - default is too tight once the storage showcase's tasks are
# also live.
CONFIG_MAIN_STACK_SIZE=2048

# HAL_HCD_MspInit registers OTG_FS_IRQn (67) via Zephyr's own IRQ_CONNECT()
# at runtime from usbh_conf_zephyr.c. Zephyr auto-sizes its ISR table
# (CONFIG_NUM_IRQS, a locked `configdefault` - not overridable from here)
# from the highest IRQ number actually referenced in devicetree; the board
# overlay deliberately leaves usbotg_fs's DT node "okay" (see its comment)
# specifically so IRQ67 stays visible to that auto-sizing.

# assert_param()/HAL_ASSERT-style checks are compiled out (USE_FULL_ASSERT
# not defined in stm32f4xx_hal_conf.h) - no CONFIG_ASSERT dependency from
# the vendored HAL/USB Host/FatFS code.
